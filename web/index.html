<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf Bridge</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17181C">
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; --line:#d1d1d6; --accent:#ff5a1f; --ink:#17181c; --stop:#ff3b30; --ok:#34c759; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0f12; --card:#1c1d22; --text:#f2f2f7; --muted:#98989f; --line:#36373d; --accent:#ff6e3a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  .brand { background:var(--ink); }
  .brand div { max-width:760px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand img { height:30px; width:auto; display:block; }
  .brand span { color:#a9adb6; font-size:13px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  h1 { font-size: 20px; margin: 4px 0; }
  .card { background:var(--card); border-radius:14px; padding:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row > * { min-width:0; max-width:100%; }
  .muted { color:var(--muted); }
  #port { overflow-wrap: anywhere; }
  .big { font: 600 28px ui-monospace, Menlo, Consolas, monospace; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; background:var(--muted); }
  button { font:inherit; border:0; border-radius:10px; padding:10px 16px; background:var(--line); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  #stop { width:100%; background:var(--stop); color:#fff; font-weight:800; font-size:22px; padding:18px; }
  progress { width:100%; height:10px; accent-color: var(--accent); }
  .jog { display:grid; grid-template-columns: repeat(3, 64px); gap:8px; }
  .jog button { height:56px; font-size:20px; padding:0; }
  select, input { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  .msg { padding:10px 12px; border-radius:10px; background:rgba(255,59,48,.12); color:var(--stop); display:none; }
  .warn { color:#c77700; }
  #camview { width:100%; aspect-ratio:4/3; object-fit:contain; background:#000; border-radius:10px; display:block; }
</style>
</head>
<body>
<header class="brand"><div>
  <img src="lockup.svg" alt="Kerf Bridge">
  <span id="version"></span>
</div></header>
<main>
  <h1 id="name">Kerf Bridge</h1>

  <button id="stop">■ STOP</button>
  <div class="msg" id="error"></div>

  <section class="card">
    <h2>Laser</h2>
    <div class="row"><span class="dot" id="dot"></span><strong id="state">Looking for the laser…</strong></div>
    <div class="row" style="gap:28px;margin-top:8px">
      <div><div class="muted">X</div><div class="big" id="x">—</div></div>
      <div><div class="muted">Y</div><div class="big" id="y">—</div></div>
    </div>
    <p class="muted" id="port"></p>
    <p id="info"></p>
    <p id="controller"></p>
  </section>

  <section class="card" id="camcard" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">Camera</h2>
      <button id="camtoggle">Hide</button>
    </div>
    <img id="camview" alt="The laser bed, live">
    <p class="muted" id="camnote" style="margin:8px 0 0"></p>
  </section>

  <section class="card">
    <h2>Job</h2>
    <div id="job" class="muted">No job yet.</div>
    <progress id="progress" value="0" max="1" hidden></progress>
    <div class="row" style="margin-top:10px">
      <button id="pause" disabled>Pause</button>
      <button id="resume" disabled>Resume</button>
      <label class="row"><input type="file" id="file" accept=".gcode,.nc,.gc,.ngc,.tap,.txt">
        <button class="primary" id="upload">Run file</button></label>
    </div>
  </section>

  <section class="card">
    <h2>Move</h2>
    <div class="row" style="align-items:flex-start;gap:24px">
      <div class="jog">
        <span></span><button data-jog="0,1">↑</button><span></span>
        <button data-jog="-1,0">←</button><button id="jogcancel">✕</button><button data-jog="1,0">→</button>
        <span></span><button data-jog="0,-1">↓</button><span></span>
      </div>
      <div style="display:grid;gap:8px">
        <label>Step <select id="step"><option>0.1</option><option>1</option><option selected>10</option><option>50</option></select> mm</label>
        <label>Speed <select id="feed"><option>500</option><option>1000</option><option selected>3000</option><option>6000</option></select> mm/min</label>
        <div class="row"><button data-cmd="$H">Home</button><button data-cmd="$X">Unlock</button></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <div style="display:grid;gap:10px">
      <label>Name <input id="cfgName" style="width:100%"></label>
      <label>Serial port <select id="cfgPort"><option value="">Find automatically</option></select></label>
      <label>Baud <select id="cfgBaud"><option value="0">Automatic</option><option>115200</option><option>250000</option><option>230400</option><option>57600</option><option>9600</option></select></label>
      <h2 style="margin:12px 0 0">Home Assistant (MQTT)</h2>
      <label>Broker <input id="mqttBroker" placeholder="e.g. 192.168.0.176 (port 1883)" style="width:100%"></label>
      <label>Username <input id="mqttUser" autocomplete="off" style="width:100%"></label>
      <label>Password <input id="mqttPass" type="password" autocomplete="new-password" style="width:100%"></label>
      <label>Discovery prefix <input id="mqttPrefix" placeholder="homeassistant" style="width:100%"></label>
      <label class="row" style="gap:8px"><input type="checkbox" id="mqttCamera"> Send a picture of the bed every few seconds while a job runs</label>
      <p class="muted" id="haStatus" style="margin:0"></p>
      <div class="row"><button id="save">Save</button><strong id="saved" style="color:var(--ok)" hidden>✓ Saved</strong><span class="muted">Port and baud apply the next time the laser connects; Home Assistant reconnects straight away.</span></div>
      <p class="muted" id="raw"></p>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let busy = false;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
function showError(e) {
  $("error").textContent = e.message || String(e);
  $("error").style.display = "block";
  setTimeout(() => $("error").style.display = "none", 6000);
}

async function refresh() {
  try {
    const s = await api("/api/status");
    const m = s.machine;
    $("name").textContent = s.bridge.name;
    $("version").textContent = "v" + s.bridge.version;
    const st = m.status;
    $("state").textContent = !m.connected ? "Looking for the laser…" : (st ? st.state : "Connected");
    $("dot").style.background = !m.connected ? "var(--muted)" : (st && st.state.startsWith("Alarm") ? "var(--stop)" : "var(--ok)");
    $("x").textContent = st ? st.wpos[0].toFixed(2) : "—";
    $("y").textContent = st ? st.wpos[1].toFixed(2) : "—";
    $("port").textContent = m.connected ? `${m.port} at ${m.baud} baud — ${m.banner}` : "";
    const i = m.machine || {};
    const bits = [];
    if (i.bedWidth && i.bedHeight) bits.push(`Bed ${i.bedWidth} × ${i.bedHeight} mm`);
    if (i.maxPower) bits.push(`power scale 0–${i.maxPower}`);
    if (i.maxRate) bits.push(`max ${i.maxRate} mm/min`);
    if (i.homing !== undefined) bits.push(i.homing ? "homing on" : "no homing");
    let info = bits.join(" · ");
    if (i.laserMode === false) {
      info += '<br><span style="color:var(--stop)">Laser mode is OFF ($32=0): GRBL keeps the laser on during travel moves. Send $32=1.</span>';
    } else if (i.laserMode) {
      info += " · laser mode on";
    }
    $("info").innerHTML = m.connected ? info : "";
    busy = m.controller !== "none";
    $("controller").innerHTML = m.controller === "passthrough"
      ? '<span class="warn">Another program (LightBurn, or Kerf in direct mode) is controlling the laser on the raw port.</span>'
      : m.controller === "job" ? "Running a job from the bridge — the device that sent it can disconnect." : "";
    const ha = s.homeAssistant;
    $("haStatus").textContent = !ha || !ha.enabled ? "Off — enter your broker to add this bridge to Home Assistant."
      : ha.connected ? "Connected to " + ha.broker + " — the bridge shows in Home Assistant as a device."
      : "Not connected" + (ha.error ? ": " + ha.error : " yet") + ".";
    const j = m.job;
    if (j) {
      $("job").textContent = `${j.name}: ${j.done} / ${j.total} lines — ${j.state}${j.message ? " — " + j.message : ""}`;
      $("progress").hidden = false;
      $("progress").value = j.total ? j.done / j.total : 0;
    }
    $("pause").disabled = !(j && j.state === "running");
    $("resume").disabled = !(j && j.state === "paused");
    $("upload").disabled = busy || !m.connected;
    document.querySelectorAll("[data-jog],[data-cmd]").forEach(b => b.disabled = busy || !m.connected);
  } catch (e) {
    $("state").textContent = "Can't reach the bridge";
  }
}

$("stop").onclick = () => api("/api/stop", { method: "POST" }).catch(showError);
$("pause").onclick = () => api("/api/job/pause", { method: "POST" }).catch(showError);
$("resume").onclick = () => api("/api/job/resume", { method: "POST" }).catch(showError);
$("upload").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return showError(new Error("Choose a G-code file first."));
  try { await api("/api/job?name=" + encodeURIComponent(f.name), { method: "POST", body: await f.text() }); }
  catch (e) { showError(e); }
};
const command = (line) => api("/api/command", { method: "POST", body: JSON.stringify({ line }) }).catch(showError);
document.querySelectorAll("[data-jog]").forEach(b => b.onclick = () => {
  const [dx, dy] = b.dataset.jog.split(",").map(Number), step = +$("step").value;
  let line = "$J=G91G21";
  if (dx) line += "X" + dx * step;
  if (dy) line += "Y" + dy * step;
  command(line + "F" + $("feed").value);
});
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => command(b.dataset.cmd));
$("jogcancel").onclick = () => command("$J=G91X0");

async function loadSettings() {
  const [cfg, ports] = await Promise.all([api("/api/config"), api("/api/ports")]);
  $("cfgName").value = cfg.name;
  for (const p of ports) {
    const o = document.createElement("option");
    o.value = p.name;
    o.textContent = p.name + (p.chip ? ` (${p.chip})` : "") + (p.product ? ` — ${p.product}` : "");
    $("cfgPort").append(o);
  }
  // A port set by hand (or not plugged in right now) still shows as chosen.
  if (cfg.serialPort && !ports.some(p => p.name === cfg.serialPort)) {
    const o = document.createElement("option");
    o.value = o.textContent = cfg.serialPort;
    $("cfgPort").append(o);
  }
  $("cfgPort").value = cfg.serialPort;
  $("mqttBroker").value = cfg.mqttBroker || "";
  $("mqttUser").value = cfg.mqttUsername || "";
  $("mqttPass").value = "";
  $("mqttPass").placeholder = cfg.mqttPasswordSet ? "Saved — type to change" : "";
  $("mqttPrefix").value = cfg.mqttPrefix || "";
  $("mqttCamera").checked = !!cfg.mqttCamera;
  $("cfgBaud").value = String(cfg.baud);
  $("raw").textContent = cfg.rawAddr
    ? `LightBurn: Devices → GRBL → Ethernet/TCP, this computer's address, port ${cfg.rawAddr.split(":").pop()}.`
    : "Raw TCP for LightBurn is off.";
}
$("save").onclick = async () => {
  try {
    await api("/api/config", { method: "PUT",
      body: JSON.stringify({ name: $("cfgName").value, serialPort: $("cfgPort").value, baud: +$("cfgBaud").value,
        mqttBroker: $("mqttBroker").value, mqttUsername: $("mqttUser").value, mqttPassword: $("mqttPass").value,
        mqttPrefix: $("mqttPrefix").value, mqttCamera: $("mqttCamera").checked }) });
    // The password isn't shown back; say it's saved instead of just emptying the box.
    $("mqttPass").value = "";
    $("mqttPass").placeholder = "Saved — type to change";
    $("saved").hidden = false;
    setTimeout(() => $("saved").hidden = true, 4000);
  } catch (e) { showError(e); }
};

// Camera: live while the page shows it. The bridge only opens the camera
// while someone is watching, so hiding it here turns it off.
let camOn = localStorage.getItem("kerf.camera") !== "off";
function showCamera() {
  $("camview").hidden = !camOn;
  $("camtoggle").textContent = camOn ? "Hide" : "Show";
  // A new URL each time, so a dropped stream starts again.
  $("camview").src = camOn ? "/api/camera/stream?t=" + Date.now() : "";
}
$("camtoggle").onclick = () => {
  camOn = !camOn;
  localStorage.setItem("kerf.camera", camOn ? "on" : "off");
  showCamera();
};
$("camview").onerror = () => { if (camOn) setTimeout(showCamera, 3000); };
api("/api/camera").then(c => {
  if (!c.available && !c.running) {
    if (c.error && !c.error.startsWith("no camera")) {
      $("camcard").hidden = false;
      $("camtoggle").hidden = true;
      $("camview").hidden = true;
      $("camnote").textContent = c.error;
    }
    return;
  }
  $("camcard").hidden = false;
  $("camnote").textContent = c.name || "";
  showCamera();
}).catch(() => {});

loadSettings().catch(showError);
refresh();
setInterval(refresh, 500);
</script>
</body>
</html>
